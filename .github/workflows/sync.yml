name: Sync Floating Point Data

on:
  schedule:
    - cron: "15 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync A-share data
        run: |
          mkdir -p data

          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime

          code = "002185"
          url = (
              "https://qt.gtimg.cn/q=sh"
              + code
          )

          try:
              raw = urllib.request.urlopen(
                  url,
                  timeout=15
              ).read().decode("gbk", errors="ignore")

              result = {
                  "code": code,
                  "source": "Tencent",
                  "updated": datetime.utcnow().isoformat(),
                  "raw": raw
              }

              with open(
                  "data/002185_live.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      result,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print("Floating Point data updated:", code)

          except Exception as e:
              print("Data update failed:", e)
              raise
          PY

      - name: Commit data
        run: |
          git config user.name "Floating Point Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || \
            git commit -m "auto: update floating point data"

          git push
