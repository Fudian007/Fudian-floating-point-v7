name: Sync Floating Point Data

on:
    schedule:
    - cron: "30 16 * * 1-5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync A-share historical K-line
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          codes = ["002185"]

          def market(code):
              return "sh" if code.startswith(("6", "9")) else "sz"

          def fetch(code, unit, count):
              symbol = market(code) + code

              url = (
                  "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get"
                  f"?_var=kline_{unit}qfq"
                  f"&param={symbol},{unit},,,{count},qfq"
              )

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Referer": "https://finance.qq.com/"
                  }
              )

              raw = urllib.request.urlopen(
                  req,
                  timeout=20
              ).read().decode("utf-8", errors="ignore")

              if "=" in raw:
                  raw = raw.split("=", 1)[1]

              obj = json.loads(raw)

              item = obj.get("data", {}).get(symbol, {})

              rows = (
                  item.get("qfq" + unit)
                  or item.get(unit)
                  or []
              )

              result = []

              for x in rows:
                  if len(x) < 6:
                      continue

                  result.append({
                      "date": x[0],
                      "open": float(x[1]),
                      "close": float(x[2]),
                      "high": float(x[3]),
                      "low": float(x[4]),
                      "volume": float(x[5]),
                      "source": "Tencent K-line / a-stock-data compatible route"
                  })

              return result

          stamp = datetime.now(timezone.utc).isoformat()

          for code in codes:

              daily = fetch(code, "day", 500)
              weekly = fetch(code, "week", 260)
              monthly = fetch(code, "month", 120)

              payload = {
                  "code": code,
                  "name": "华天科技",
                  "source": "Tencent K-line / a-stock-data compatible route",
                  "updated": stamp,
                  "data": daily,
                  "weekly": weekly,
                  "monthly": monthly
              }

              with open(
                  f"data/{code}.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      payload,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              with open(
                  f"{code}.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      payload,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  code,
                  "daily=",
                  len(daily),
                  "weekly=",
                  len(weekly),
                  "monthly=",
                  len(monthly)
              )

              if not daily:
                  raise RuntimeError(
                      "No daily K-line data returned"
                  )
          PY

      - name: Commit data
        run: |
          git config user.name "Floating Point Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/ 002185.json

          git diff --cached --quiet || \
            git commit -m "auto: update floating point K-line data"

          git push
