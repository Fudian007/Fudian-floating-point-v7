<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d"><title>浮点 V7.1 · A股专业观察终端</title>
<style>
:root{--bg:#07101d;--panel:#0d1726;--panel2:#101d30;--line:#223149;--text:#e7eef9;--muted:#8ea0b8;--red:#ff4d5e;--green:#27c98a;--yellow:#ffd166;--blue:#4da3ff;--orange:#ff9f43}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101d,#0a1422);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1280px;margin:auto;padding:10px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-size:22px;font-weight:800}.sub{color:var(--muted);font-size:12px}.search{display:flex;gap:8px;flex:1;min-width:240px}.search input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px}.btn{background:#17253a;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}.btn.active{background:#294363}
.tabs{display:flex;gap:6px;margin:10px 0;overflow:auto}.tab{white-space:nowrap}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar label{color:var(--muted);font-size:12px}.toolbar input[type=date]{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px}.range{width:180px}
.grid{display:grid;grid-template-columns:1fr 310px;gap:10px}.panel{background:rgba(13,23,38,.94);border:1px solid var(--line);border-radius:14px;padding:11px}.quote{display:grid;grid-template-columns:1.35fr repeat(5,1fr);gap:8px;margin-bottom:10px}.q strong{font-size:24px}.q small{display:block;color:var(--muted)}.up{color:var(--red)}.down{color:var(--green)}
.chart{height:470px}.chart svg{width:100%;height:100%;display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{background:var(--panel2);padding:9px;border-radius:9px}.metric span{color:var(--muted);font-size:12px}.metric b{display:block;font-size:17px;margin-top:3px}.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:7px 0}.note,.status{color:var(--muted);font-size:11px;margin-top:9px}.footer{color:#71829a;font-size:11px;padding:12px 2px}.signal{padding:9px;border-radius:9px;background:var(--panel2);margin-bottom:7px}.signal b{display:block}.s-red{color:var(--red)}.s-yellow{color:var(--yellow)}.s-green{color:var(--green)}.s-blue{color:var(--blue)}.s-orange{color:var(--orange)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.quote{grid-template-columns:1.3fr repeat(3,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.chart{height:390px}}
@media(max-width:520px){.wrap{padding:7px}.brand{font-size:19px}.search{min-width:100%}.quote{grid-template-columns:1fr 1fr}.quote .q:first-child{grid-column:1/-1}.chart{height:320px}.metrics{grid-template-columns:1fr 1fr}.range{width:130px}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">浮点 V7.1</div><div class="sub">真实行情 · 固定规则 · 模型与事实分离</div></div><div class="search"><input id="code" value="002185" inputmode="numeric" maxlength="6" placeholder="输入6位A股代码"><button class="btn" id="load">查询</button></div></div>
<div class="tabs"><button class="btn tab active" data-p="day">日K</button><button class="btn tab" data-p="week">周K</button><button class="btn tab" data-p="month">月K</button></div>
<div class="toolbar panel"><label>观察到：</label><input id="asof" type="date"><label>显示K线：</label><input id="bars" class="range" type="range" min="30" max="300" value="120"><span id="barsText">120根</span></div>
<div class="panel quote" id="quote"></div><div class="grid"><main>
<div class="panel"><div id="chart" class="chart"></div><div class="legend"><span><i class="dot" style="background:var(--red)"></i>做多主导</span><span><i class="dot" style="background:var(--yellow)"></i>获利回吐</span><span><i class="dot" style="background:var(--green)"></i>做空主导</span><span><i class="dot" style="background:var(--blue)"></i>空头回补</span><span><i class="dot" style="background:var(--orange)"></i>机构库存模拟</span></div><div id="status" class="status"></div></div>
<div class="panel"><h3>浮点模型</h3><div class="metrics" id="metrics"></div><div class="note">机构库存、游资动向、主导动能及行为信号均为基于公开行情数据的模型变量，不代表真实机构持仓或主观意图。模型只使用观察日及此前数据，固定规则，不按单只股票调参。</div></div>
</main><aside><div class="panel"><h3>数据状态</h3><div id="info"></div></div><div class="panel"><h3>行为信号</h3><div id="signals"></div></div></aside></div>
<div class="footer">数据由 GitHub Actions 同步；网页读取 data/代码.json。若数据缺失，页面保持空白，不用估算值补齐。</div></div>
<script>
const $=s=>document.querySelector(s),state={code:"002185",period:"day",rows:[],raw:null};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function sma(a,n){let z=a.slice(-n).filter(Number.isFinite);return z.length?z.reduce((x,y)=>x+y,0)/z.length:NaN}
function atr(rows,n=14){let tr=[];for(let i=0;i<rows.length;i++){let x=rows[i],p=rows[i-1],t=x.high-x.low;if(p)t=Math.max(t,Math.abs(x.high-p.close),Math.abs(x.low-p.close));tr.push(t)}return sma(tr,n)}
function metrics(r){const last=r[r.length-1],prev=r[r.length-2];if(!last)return{};const a=r.slice(-20),avg=sma(a.map(x=>x.close),20),va=sma(a.map(x=>x.volume),20),vr=va?last.volume/va:NaN,mom=avg?(last.close/avg-1)*100:NaN;let bull=0,bear=0;a.forEach(x=>x.close>x.open?bull+=x.volume:x.close<x.open?bear+=x.volume:0);const dom=bull+bear?(bull-bear)/(bull+bear)*100:NaN,body=last.open?(last.close-last.open)/last.open*100:0;const inv=Math.max(-100,Math.min(100,(mom||0)*2.2+(vr-1)*25));const hot=Math.max(-100,Math.min(100,(vr-1)*55+body*4+(mom||0)*1.5));let rets=a.slice(1).map((x,i)=>x.close/a[i].close-1).filter(Number.isFinite),mean=rets.length?rets.reduce((s,x)=>s+x,0)/rets.length:0,sd=rets.length?Math.sqrt(rets.reduce((s,x)=>s+(x-mean)**2,0)/rets.length):0,trend=sd?Math.max(-100,Math.min(100,(mom/100)/sd*10)):0;let signal="中性",color="";if(dom>=45&&inv>=10){signal="做多主导";color="s-red"}else if(dom<=-45&&inv<=-10){signal="做空主导";color="s-green"}else if(dom<=-20&&inv>15){signal="空头回补";color="s-blue"}else if(dom>=20&&inv<-15){signal="获利回吐";color="s-yellow"}if(vr>=1.8&&dom>=45&&inv>=25){signal="强力回补";color="s-blue"}if(vr>=1.8&&dom<=-45&&inv<=-25){signal="强力回吐";color="s-yellow"}return{last,prev,avg,vr,mom,dom,inventory:inv,hot,trend,atr14:atr(r),signal,color}}
function periodRows(d){return state.period==="week"?(d.weekly||[]):state.period==="month"?(d.monthly||[]):(d.data||[])}
function render(){let r=state.rows;if(!r.length){$("#quote").innerHTML="";$("#chart").innerHTML="<div class='note'>暂无数据</div>";$("#metrics").innerHTML="";return}const c=metrics(r),last=c.last,prev=c.prev,chg=prev?(last.close/prev.close-1)*100:NaN;$("#quote").innerHTML=`<div class=q><strong>${esc(state.raw?.name||state.code)}</strong><small>${state.code} · ${state.period==="day"?"日K":state.period==="week"?"周K":"月K"}</small></div><div class=q><small>收盘</small><b>${last.close.toFixed(2)}</b></div><div class=q><small>涨跌</small><b class="${chg>=0?'up':'down'}">${Number.isFinite(chg)?(chg>=0?"+":"")+chg.toFixed(2)+"%":"—"}</b></div><div class=q><small>最高</small><b>${last.high.toFixed(2)}</b></div><div class=q><small>最低</small><b>${last.low.toFixed(2)}</b></div><div class=q><small>成交量</small><b>${(last.volume/10000).toFixed(1)}万手</b></div>`;
const cutoff=$("#asof").value,source=r.filter(x=>!cutoff||x.date<=cutoff),v=source.slice(-Number($("#bars").value)),W=1000,H=440,pL=48,pR=12,pT=16,pB=28,min=Math.min(...v.map(x=>x.low)),max=Math.max(...v.map(x=>x.high)),xs=v.map((_,i)=>pL+i*(W-pL-pR)/Math.max(1,v.length-1)),sy=x=>pT+(max-x)/(max-min||1)*(H-pT-pB);let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;for(let i=0;i<5;i++){let y=pT+i*(H-pT-pB)/4,val=max-(max-min)*i/4;svg+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#223149"/><text x="4" y="${y+4}" fill="#71829a" font-size="11">${val.toFixed(2)}</text>`}const w=Math.max(2,Math.min(10,(W-pL-pR)/Math.max(1,v.length)*.65));v.forEach((x,i)=>{let X=xs[i],up=x.close>=x.open,col=up?"#ff4d5e":"#27c98a",yo=sy(x.open),yc=sy(x.close);svg+=`<line x1="${X}" y1="${sy(x.high)}" x2="${X}" y2="${sy(x.low)}" stroke="${col}"/><rect x="${X-w/2}" y="${Math.min(yo,yc)}" width="${w}" height="${Math.max(1,Math.abs(yc-yo))}" fill="${col}"/>`});$("#chart").innerHTML=svg+"</svg>";$("#status").textContent=`观察到 ${last.date||"—"} · 当前显示 ${v.length} 根K线 · 参数固定`;
const vals=[["主导动能",c.dom.toFixed(1),"模型值"],["机构库存模拟",c.inventory.toFixed(1),"模型值"],["游资动向模拟",c.hot.toFixed(1),"模型值"],["20期均价",c.avg.toFixed(2),"参考"],["量能比",c.vr.toFixed(2),"当期/20期"],["ATR(14)",c.atr14.toFixed(2),"波动"],["趋势强度",c.trend.toFixed(1),"标准化"],["行为信号",c.signal,"模型识别"]];$("#metrics").innerHTML=vals.map(x=>`<div class=metric><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join("");
$("#info").innerHTML=`<div class=kv><span>最新交易日</span><b>${esc(last.date||"—")}</b></div><div class=kv><span>数据根数</span><b>${r.length}</b></div><div class=kv><span>数据源</span><b>${esc(last.source||state.raw?.source||"—")}</b></div><div class=kv><span>更新时间</span><b>${esc(state.raw?.updated||"—")}</b></div>`;
let s=[];const add=(n,on,cl)=>{if(on)s.push(`<div class="signal ${cl}"><b>${n}</b><span>当前周期模型触发</span></div>`)};add("资金交点",c.dom*c.hot<0,"s-orange");add("机构震仓",c.inventory<0&&c.dom>0,"s-orange");add("游资回补",c.hot>45,"s-blue");add("做多主导",c.signal==="做多主导","s-red");add("获利回吐",c.signal==="获利回吐","s-yellow");add("做空主导",c.signal==="做空主导","s-green");add("空头回补",c.signal==="空头回补","s-blue");add("强力回补",c.signal==="强力回补","s-blue");add("强力回吐",c.signal==="强力回吐","s-yellow");$("#signals").innerHTML=s.length?s.join(""):"<div class=note>当前固定规则未触发特定行为信号。</div>"}
async function load(){state.code=$("#code").value.trim().replace(/\D/g,"").padStart(6,"0");$("#code").value=state.code;try{let res=await fetch(`data/${state.code}.json?${Date.now()}`,{cache:"no-store"});if(!res.ok)throw Error("该代码尚未同步");state.raw=await res.json();state.rows=periodRows(state.raw);let ds=state.rows.map(x=>x.date).filter(Boolean);if(ds.length){$("#asof").max=ds[ds.length-1];if(!$("#asof").value||$("#asof").value>$("#asof").max)$("#asof").value=$("#asof").max}render()}catch(e){state.rows=[];state.raw=null;$("#quote").innerHTML="";$("#chart").innerHTML=`<div class=note>暂无 ${state.code} 的数据。<br>${esc(e.message)}</div>`;$("#metrics").innerHTML="";$("#info").innerHTML="";$("#signals").innerHTML=""}}
$("#load").onclick=load;$("#code").addEventListener("keydown",e=>{if(e.key==="Enter")load()});$("#asof").addEventListener("change",render);$("#bars").addEventListener("input",()=>{$("#barsText").textContent=$("#bars").value+"根";render()});document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.period=b.dataset.p;load()});load();
</script></body></html>
